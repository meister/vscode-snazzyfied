name: Publish Extension
on:
  workflow_dispatch: # Manual trigger
    inputs:
      version:
        description: 'Version type to publish'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' # Specify the Node.js version

    - name: Install dependencies
      run: npm install

    - name: Azure Devops Auth
      env:
        AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }} # Access NPM token securely from GitHub Secrets
      run: npm run login

    - name: Build and Publish Extension
      env:
        AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }} # Access NPM token securely from GitHub Secrets
      run: |
        echo "Building the package"
        npm run build
        echo "Publishing ${{ github.event.inputs.version }} release"
        npm run vsce-publish -- ${{ github.event.inputs.version }}

    - name: Push changes back to master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub token for pushing changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        # Ensure we are on the master branch
        git checkout master

        # Add any changes (e.g., package version bump)
        git add .

        # Commit changes if there are any
        git commit -m "Publish version $TAG_NAME" || echo "No changes to commit"

        # Push changes back to the master branch
        git push origin master